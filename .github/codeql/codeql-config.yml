name: "BaseFWX CodeQL config"

# Run the default security queries plus the lower-severity and lower-precision
# security queries from security-extended. Keep maintainability and reliability
# findings in the normal lint/test tools rather than the security alert queue.
# The path filters below only narrow what gets scanned.
queries:
  - uses: security-extended

# Vendored / generated trees that we don't own. Excluding these only stops
# CodeQL from scanning files inside them. Everything else (cpp/src, cpp/include,
# java/src, python/, scripts/, .github/scripts/) keeps full coverage.
paths-ignore:
  - "cpp/third_party/**"
  - "cpp/build/**"
  - "java/build/**"
  - "java/.gradle/**"
  - "build/**"
  - "dist/**"
  - "**/*.min.js"
  - ".cache/**"
