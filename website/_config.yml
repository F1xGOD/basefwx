title: BaseFWX
description: >-
  BaseFWX is a cryptographic container engine with portable authenticated
  format variants across C++, Python, and Java.

markdown: kramdown
theme: null
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Bumped whenever assets/site.css or assets/site.js changes, so returning
# visitors are not served a cached stylesheet against new markup. One place,
# read by _includes/head.html.
asset_version: 11

repo_url: https://github.com/F1xGOD/basefwx

exclude:
  - .jekyll-cache
  - README.md
