<footer class="site-footer foot-dense">
  <p class="footer-colophon"><strong>BASEFWX</strong> authenticated containers across C++, Python, and Java. Release files carry detached signatures and checksum sidecars.</p>
  <nav aria-label="Footer navigation">
    {%- for item in site.data.nav.footer -%}
      {%- if item.external -%}
        <a href="{{ item.url }}" target="_blank" rel="noopener">{{ item.label }}</a>
      {%- else -%}
        <a href="{{ item.url | relative_url }}">{{ item.label }}</a>
      {%- endif -%}
    {%- endfor -%}
  </nav>
</footer>
