<!doctype html>
<html lang="en" data-asset-base="{{ '/assets/' | relative_url }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | BaseFWX</title>
    <meta name="description" content="{{ page.title }} documentation for BaseFWX.">
    <link rel="icon" type="image/svg+xml" href="{{ '/assets/basefwx-white.svg' | relative_url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <script src="{{ '/assets/site.js' | relative_url }}" defer></script>
  </head>
  <body>
    <div class="doc-container">
      <header class="doc-header">
        <a class="doc-brand" href="{{ '/' | relative_url }}">
          <span class="brand-mark" aria-hidden="true">
            <span class="brand-icon" aria-hidden="true"></span>
            <span class="brand-cutout" aria-hidden="true"></span>
          </span>
          <span>
            <span class="brand-name">BaseFWX</span>
            <span class="brand-sub">A FixCraft cryptographic engine</span>
          </span>
        </a>
        <nav class="doc-nav" aria-label="Documentation navigation">
          <a href="{{ '/' | relative_url }}">Portal</a>
          <a href="{{ '/docs/CLI/' | relative_url }}">CLI</a>
          <a href="{{ '/docs/SECURITY_MODEL/' | relative_url }}">Security</a>
          <a href="{{ '/docs/TESTING/' | relative_url }}">Testing</a>
          <a href="{{ '/docs/CONTRIBUTING/' | relative_url }}">Contributing</a>
          <a href="https://github.com/F1xGOD/basefwx" target="_blank" rel="noopener">GitHub</a>
        </nav>
      </header>
      <main class="doc-shell">
        <details class="doc-toc" open>
          <summary>On this page</summary>
          <nav id="doc-toc-list" aria-label="On this page"></nav>
        </details>
        <article class="doc-article">
          {{ content }}
        </article>
      </main>
    </div>
  </body>
</html>
