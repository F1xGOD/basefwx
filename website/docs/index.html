<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="refresh" content="0; url=../">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BaseFWX docs</title>
    <link rel="canonical" href="../">
    <link rel="icon" type="image/svg+xml" href="../assets/basefwx-plain.svg">
    <meta name="theme-color" content="#0b090f" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#fbf9fd" media="(prefers-color-scheme: light)">
    <script>
      try {
        var t = localStorage.getItem("basefwx-theme");
        if (t === "dark" || t === "light") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="../assets/site.css?v=7">
    <style>
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: var(--space-lg);
      }

      .redirect {
        max-width: 26rem;
      }
    </style>
  </head>
  <body>
    <div class="card redirect">
      <h3>Redirecting</h3>
      <p>The documentation index lives on the release portal.</p>
      <div class="card-foot">
        <a class="btn" href="../">Open the portal</a>
      </div>
    </div>
  </body>
</html>
